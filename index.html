<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="CirosBlack — animes, filmes, séries e cursos em um só lugar." />
  <title>CirosBlack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --red: #ef4444; --red-soft: #f87171; --bg: #08080a; --surface: #131316; --line: #26262c; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(900px 500px at 10% -10%, rgba(239,68,68,.16), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(59,59,200,.10), transparent 60%);
      background-attachment: fixed;
    }
    /* Foco visível para teclado */
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    /* Grid responsivo: sem regra forçada de 4 colunas no celular */
    #grid-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    @media (min-width: 640px) { #grid-container { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

    .card { animation: rise .4s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .poster { aspect-ratio: 2 / 3; background: var(--surface); }
    .card:hover .poster img, .card:focus-within .poster img { transform: scale(1.06); }
    .poster img { transition: transform .5s ease; }
    .card-shade { background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.0) 55%); }

    .skeleton { background: linear-gradient(100deg, #17171b 40%, #202026 50%, #17171b 60%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .chip { transition: background .2s, color .2s, border-color .2s; }
    .chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }

    .nav-scroll { overflow-x: auto; scrollbar-width: none; }
    .nav-scroll::-webkit-scrollbar { display: none; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card, .skeleton { animation: none; }
      .poster img { transition: none; }
    }
  </style>
</head>
<body class="text-gray-100">

  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] focus:bg-red-500 focus:text-white focus:px-4 focus:py-2 focus:rounded">Pular para o conteúdo</a>

  <!-- CABEÇALHO -->
  <header class="sticky top-0 z-50 bg-black/70 backdrop-blur-md border-b border-white/5">
    <div class="container mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-3">
      <a href="https://cirosblack.github.io/public/" class="text-2xl sm:text-3xl font-extrabold tracking-wider" aria-label="CirosBlack — página inicial">
        CIROS<span class="text-red-500">BLACK</span>
      </a>

      <nav aria-label="Principal" class="nav-scroll order-3 sm:order-2 w-full sm:w-auto flex items-center gap-1 -mx-1">
        <a href="https://cirosblack.github.io/public/" class="px-3 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition">Início</a>
        <button type="button" data-nav-cat="anime" class="nav-cat px-3 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition">Animes</button>
        <button type="button" data-nav-cat="filme" class="nav-cat px-3 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition">Filmes</button>
        <button type="button" data-nav-cat="serie" class="nav-cat px-3 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition">Séries</button>
        <a href="https://cirosblack.github.io/public/Cursos" class="px-3 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition">Cursos</a>
      </nav>

      <div class="order-2 sm:order-3 ml-auto relative flex-1 sm:flex-none sm:w-72 min-w-[10rem]">
        <label for="searchInput" class="sr-only">Pesquisar conteúdos</label>
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Pesquisar…  ( / )"
          class="w-full bg-white/5 border border-white/10 rounded-full py-2 pl-9 pr-9 text-white placeholder-gray-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/40 transition [&::-webkit-search-cancel-button]:hidden" />
        <button id="clearSearch" type="button" aria-label="Limpar pesquisa" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full text-gray-400 hover:text-white hover:bg-white/10">✕</button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="container mx-auto px-4 pt-10 sm:pt-14 pb-20">
    <section class="mb-10 sm:mb-12">
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight">Bem-vindo, CirosBlack</h1>
      <p class="mt-3 text-lg sm:text-xl text-gray-400">Todos os seus conteúdos em um só lugar.</p>
    </section>

    <section aria-labelledby="titulo-destaques">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
        <h2 id="titulo-destaques" class="text-2xl sm:text-3xl font-bold border-l-4 border-red-500 pl-4">Destaques</h2>
        <p id="resultCount" class="text-sm text-gray-400" aria-live="polite"></p>
      </div>

      <!-- Barra de filtros -->
      <div class="flex flex-wrap items-center gap-2 mb-6">
        <div id="chips" class="flex flex-wrap gap-2" role="group" aria-label="Filtrar por categoria"></div>
        <div class="ml-auto flex items-center gap-2">
          <button id="favToggle" type="button" aria-pressed="false" class="chip border border-white/15 rounded-full px-3 py-1.5 text-sm text-gray-200 hover:border-red-500">♥ Favoritos</button>
          <label for="sortSelect" class="sr-only">Ordenar</label>
          <select id="sortSelect" class="bg-[#131316] border border-white/15 rounded-full px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-red-500">
            <option value="default">Ordem original</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>
      </div>

      <div class="grid gap-4 sm:gap-6" id="grid-container" aria-busy="true"></div>
      <div id="emptyState" class="hidden text-center py-20"></div>
    </section>
  </main>

  <button id="toTop" type="button" aria-label="Voltar ao topo" class="fixed bottom-5 right-5 z-40 w-11 h-11 rounded-full bg-red-500 text-white shadow-lg shadow-red-500/30 opacity-0 pointer-events-none transition-opacity hover:bg-red-400">↑</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ====== CONFIGURAÇÃO ======
      const CONFIG = {
        dataUrl: 'dados/cards.json',
        blockContextMenu: true,   // false para liberar o botão direito
        fetchTimeoutMs: 10000,
        favKey: 'cirosblack:favoritos'
      };

      const $ = id => document.getElementById(id);
      const grid = $('grid-container'), searchInput = $('searchInput'), clearBtn = $('clearSearch');
      const chipsBox = $('chips'), favToggle = $('favToggle'), sortSel = $('sortSelect');
      const countEl = $('resultCount'), emptyEl = $('emptyState'), toTop = $('toTop');

      const state = { cards: [], query: '', cat: 'todos', favOnly: false, sort: 'default', favs: new Set() };

      // ====== UTILITÁRIOS ======
      const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      const safeUrl = u => /^(https?:|\/|\.|#|[\w-]+\/)/i.test(u || '') && !/^javascript:/i.test(u) ? u : '#';
      const idOf = c => c.link && c.link !== '#' ? c.link : c.title;
      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
      const placeholder = t => `https://placehold.co/300x450/131316/FFFFFF?text=${encodeURIComponent(t)}`;

      // Favoritos (localStorage pode estar indisponível)
      try { state.favs = new Set(JSON.parse(localStorage.getItem(CONFIG.favKey) || '[]')); } catch (_) {}
      const saveFavs = () => { try { localStorage.setItem(CONFIG.favKey, JSON.stringify([...state.favs])); } catch (_) {} };

      if (CONFIG.blockContextMenu) document.addEventListener('contextmenu', e => e.preventDefault());

      // ====== RENDERIZAÇÃO ======
      function cardHTML(c, i) {
        const fav = state.favs.has(idOf(c));
        return `
          <article class="card group relative" style="animation-delay:${Math.min(i, 12) * 40}ms">
            <a href="${esc(safeUrl(c.link))}" class="block rounded-xl overflow-hidden bg-[#131316] ring-1 ring-white/5 transition duration-300 group-hover:ring-red-500/60 group-hover:-translate-y-1 group-hover:shadow-xl group-hover:shadow-red-500/20">
              <div class="poster relative overflow-hidden">
                <img src="${esc(c.image)}" alt="Capa de ${esc(c.title)}" loading="lazy" decoding="async" class="w-full h-full object-cover" data-title="${esc(c.title)}">
                <div class="card-shade absolute inset-0"></div>
                <div class="absolute bottom-0 inset-x-0 p-3">
                  <h3 class="font-bold text-white text-sm sm:text-base leading-tight line-clamp-2">${esc(c.title)}</h3>
                  <span class="text-xs sm:text-sm text-red-400">${esc(c.category)}</span>
                </div>
              </div>
            </a>
            <button type="button" data-fav="${esc(idOf(c))}" aria-pressed="${fav}" aria-label="${fav ? 'Remover' : 'Adicionar'} ${esc(c.title)} ${fav ? 'dos' : 'aos'} favoritos"
              class="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/60 backdrop-blur text-lg leading-none flex items-center justify-center transition hover:bg-black/80 ${fav ? 'text-red-500' : 'text-white/80'}">${fav ? '♥' : '♡'}</button>
          </article>`;
      }

      function skeletons(n = 12) {
        grid.setAttribute('aria-busy', 'true');
        grid.innerHTML = Array.from({ length: n }, () =>
          `<div class="rounded-xl overflow-hidden ring-1 ring-white/5"><div class="poster skeleton"></div></div>`).join('');
      }

      function visibleCards() {
        const q = norm(state.query);
        let list = state.cards.filter(c => {
          if (state.favOnly && !state.favs.has(idOf(c))) return false;
          if (state.cat !== 'todos' && !norm(c.category).includes(state.cat)) return false;
          return !q || norm(c.title).includes(q) || norm(c.category).includes(q);
        });
        if (state.sort === 'az') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'));
        if (state.sort === 'za') list = [...list].sort((a, b) => b.title.localeCompare(a.title, 'pt-BR'));
        return list;
      }

      function render() {
        const list = visibleCards();
        grid.setAttribute('aria-busy', 'false');
        grid.innerHTML = list.map(cardHTML).join('');
        countEl.textContent = state.cards.length ? `${list.length} de ${state.cards.length} títulos` : '';

        const empty = !list.length && state.cards.length;
        emptyEl.classList.toggle('hidden', !empty);
        if (empty) {
          const msg = state.favOnly && !state.query && state.cat === 'todos'
            ? 'Você ainda não marcou nenhum favorito. Toque no ♡ de um título para salvá-lo aqui.'
            : 'Nenhum título encontrado. Tente outro termo ou limpe os filtros.';
          emptyEl.innerHTML = `<p class="text-gray-300 mb-4">${msg}</p>
            <button type="button" id="resetFilters" class="bg-red-500 hover:bg-red-400 text-white font-bold px-5 py-2 rounded-full transition">Limpar filtros</button>`;
        }
        syncNav();
      }

      function buildChips() {
        const cats = [...new Set(state.cards.map(c => c.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
        const make = (label, value) =>
          `<button type="button" data-cat="${esc(value)}" aria-pressed="${state.cat === value}" class="chip border border-white/15 rounded-full px-3 py-1.5 text-sm text-gray-200 hover:border-red-500">${esc(label)}</button>`;
        chipsBox.innerHTML = make('Todos', 'todos') + cats.map(c => make(c, norm(c))).join('');
      }

      function syncChips() {
        chipsBox.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === state.cat));
        favToggle.setAttribute('aria-pressed', state.favOnly);
      }
      function syncNav() {
        document.querySelectorAll('.nav-cat').forEach(b => {
          const on = state.cat !== 'todos' && state.cat.includes(b.dataset.navCat);
          b.classList.toggle('text-red-500', on); b.classList.toggle('font-bold', on);
          b.setAttribute('aria-pressed', on);
        });
        syncChips();
      }
      const update = () => { render(); };

      // ====== EVENTOS ======
      searchInput.addEventListener('input', debounce(() => {
        state.query = searchInput.value;
        clearBtn.classList.toggle('hidden', !searchInput.value);
        update();
      }, 150));
      clearBtn.addEventListener('click', () => {
        searchInput.value = ''; state.query = ''; clearBtn.classList.add('hidden'); searchInput.focus(); update();
      });
      document.addEventListener('keydown', e => {
        const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
        if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); }
        if (e.key === 'Escape' && document.activeElement === searchInput) clearBtn.click();
      });

      chipsBox.addEventListener('click', e => {
        const b = e.target.closest('[data-cat]'); if (!b) return;
        state.cat = b.dataset.cat; update();
      });
      document.querySelectorAll('.nav-cat').forEach(b => b.addEventListener('click', () => {
        const key = b.dataset.navCat;
        const match = [...new Set(state.cards.map(c => norm(c.category)))].find(c => c.includes(key));
        state.cat = state.cat.includes(key) ? 'todos' : (match || key);
        update();
        document.getElementById('titulo-destaques').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }));
      favToggle.addEventListener('click', () => { state.favOnly = !state.favOnly; update(); });
      sortSel.addEventListener('change', () => { state.sort = sortSel.value; update(); });

      grid.addEventListener('click', e => {
        const b = e.target.closest('[data-fav]'); if (!b) return;
        const id = b.dataset.fav;
        state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
        saveFavs();
        state.favOnly ? update() : (() => {
          const on = state.favs.has(id);
          b.textContent = on ? '♥' : '♡';
          b.setAttribute('aria-pressed', on);
          b.classList.toggle('text-red-500', on); b.classList.toggle('text-white/80', !on);
        })();
      });
      emptyEl.addEventListener('click', e => {
        if (e.target.id !== 'resetFilters') return;
        Object.assign(state, { query: '', cat: 'todos', favOnly: false });
        searchInput.value = ''; clearBtn.classList.add('hidden'); update();
      });

      // Imagem quebrada → placeholder (o evento "error" não propaga, por isso usa captura)
      grid.addEventListener('error', e => {
        const img = e.target;
        if (img.tagName === 'IMG' && !img.dataset.fallback) { img.dataset.fallback = '1'; img.src = placeholder(img.dataset.title); }
      }, true);

      // Botão "voltar ao topo"
      const onScroll = () => {
        const show = window.scrollY > 600;
        toTop.classList.toggle('opacity-0', !show); toTop.classList.toggle('pointer-events-none', !show);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      toTop.addEventListener('click', () => window.scrollTo({ top: 0 }));

      // ====== CARREGAMENTO ======
      async function loadCards() {
        skeletons();
        emptyEl.classList.add('hidden');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CONFIG.fetchTimeoutMs);
        try {
          const res = await fetch(CONFIG.dataUrl, { signal: ctrl.signal });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const list = Array.isArray(json) ? json : (json.cards || []);
          state.cards = list.filter(c => c && c.title).map(c => ({
            title: c.title, category: c.category || 'Sem categoria', link: c.link || '#',
            image: c.image || placeholder(c.title)
          }));
          buildChips();
          if (!state.cards.length) {
            grid.innerHTML = ''; grid.setAttribute('aria-busy', 'false');
            emptyEl.classList.remove('hidden');
            emptyEl.innerHTML = '<p class="text-gray-300">Ainda não há conteúdos cadastrados.</p>';
            return;
          }
          render();
        } catch (err) {
          console.error('Erro ao carregar os cards:', err);
          grid.innerHTML = ''; grid.setAttribute('aria-busy', 'false'); countEl.textContent = '';
          emptyEl.classList.remove('hidden');
          emptyEl.innerHTML = `<p class="text-red-400 mb-1 font-bold">Não foi possível carregar os conteúdos.</p>
            <p class="text-gray-400 mb-4 text-sm">Verifique sua conexão. Se abriu o arquivo direto do computador, use um servidor local (ex.: <code>npx serve</code>), pois o navegador bloqueia o carregamento do JSON em file://.</p>
            <button type="button" id="retry" class="bg-red-500 hover:bg-red-400 text-white font-bold px-5 py-2 rounded-full transition">Tentar novamente</button>`;
          $('retry').addEventListener('click', loadCards, { once: true });
        } finally { clearTimeout(timer); }
      }

      loadCards();
    });
  </script>
</body>
</html>
